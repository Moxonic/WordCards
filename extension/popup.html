<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 0;
        width: 300px;
        color: #1e293b;
      }
      header {
        background: #f1f5f9;
        padding: 12px 14px;
        font-weight: 600;
      }
      main {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      button {
        font: inherit;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .muted {
        color: #64748b;
      }
      label.toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .err {
        color: #b91c1c;
      }
      hr {
        border: none;
        border-top: 1px solid #e2e8f0;
        margin: 2px 0;
      }
    </style>
  </head>
  <body>
    <header>WordCards Sync</header>
    <main>
      <div id="authArea"></div>
      <hr />
      <div class="row"><span class="muted">Last sync</span><span id="lastSync">–</span></div>
      <div class="row"><span class="muted">Added last time</span><span id="lastAdded">–</span></div>
      <div class="row"><span class="muted">Total synced</span><span id="total">–</span></div>
      <div class="row" id="pendingRow" hidden>
        <span class="muted">Queued (offline)</span><span id="pending">0</span>
      </div>
      <div id="error" class="err" hidden></div>
      <hr />
      <label class="toggle" title="When on, every new translation on translate.google.com is sent to your account automatically">
        <input type="checkbox" id="autoSync" />
        Auto-sync new translations
      </label>
      <button id="scanBtn" title="Read the History / Saved list on the current translate.google.com tab and send it now">Scan this page now</button>
      <p class="muted" id="scanHint">Open translate.google.com (History panel or /saved) first.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
